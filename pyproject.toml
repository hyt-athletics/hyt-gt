[project]
name = "geophys-tool"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "numpy>=1.26",
    "pandas>=2.0",
    "lasio>=0.31",
    "segyio>=1.9",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pywavelets>=1.4",
    "empymod>=2.2",
]

[project.optional-dependencies]
compile = ["cython>=3.0", "setuptools>=68"]
3d = [
    "discretize>=0.10",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "SimPEG>=0.21",
    "meshio>=5.3",
]

[project.scripts]
geophys-tool = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
